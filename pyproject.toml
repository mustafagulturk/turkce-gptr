[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "turkce-gpt"
version = "0.1.0"
description = "Sıfırdan yazılmış küçük bir Türkçe GPT dil modeli (tokenizer, eğitim, ince ayar, sohbet)"
requires-python = ">=3.10"
authors = [{ name = "Mustafa Gültürk" }]
dependencies = ["torch>=2.1", "numpy>=1.24"]

[project.optional-dependencies]
wikipedia = ["datasets>=2.14"]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["turkce_gpt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
