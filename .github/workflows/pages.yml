name: sohbet-sayfasi

# web/ klasörünü GitHub Pages'te yayınlar. Model iki yerden gelebilir:
# repodaki web/model/ klasörü ya da en son Release'teki model.json + model.bin.
# Hangisi daha yeniyse o kullanılır.
#
# Yeni bir Release yükledikten sonra: Actions → sohbet-sayfasi → "Run workflow".
# (Release olayıyla otomatik çalıştırılmıyor: o çalışma etiket (v1) üzerinden
# başlar ve github-pages ortamı yalnızca main dalından yayına izin verir.)
on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  yayinla:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # web/model'in son değiştiği tarihi görmek için tüm geçmiş
      - name: Release'teki modeli al (repodakinden yeniyse)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # İki yerden model gelebilir: repodaki web/model/ ya da en son Release.
          # Hangisi daha yeniyse o yayınlanır.
          rel=$(gh release view --repo "$GITHUB_REPOSITORY" --json publishedAt -q .publishedAt 2>/dev/null || true)
          repo=$(git log -1 --format=%cI -- web/model)
          echo "Release: ${rel:-yok} | repodaki model: $repo"
          if [ -n "$rel" ] && [ "$(date -d "$rel" +%s)" -gt "$(date -d "$repo" +%s)" ] \
             && gh release download --repo "$GITHUB_REPOSITORY" --pattern 'model.json' --pattern 'model.bin' -D yeni_model \
             && [ -f yeni_model/model.json ] && [ -f yeni_model/model.bin ]; then
            cp yeni_model/model.json yeni_model/model.bin web/model/
            echo "Release'teki model kullanılıyor"
          else
            echo "Repodaki web/model kullanılıyor"
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
